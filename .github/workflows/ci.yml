name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # This repo is public. The denylist lives only in the PII_DENYLIST secret, and the scanner
  # never prints matched terms, only file:line and the term's number.
  pii-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Scan tracked files for PII
        run: node scripts/check-pii.mjs --all
        env:
          PII_DENYLIST: ${{ secrets.PII_DENYLIST }}

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Lint, type-check, unit tests (100% coverage) and E2E
        run: npm run verify
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
